<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibtissam &amp; Hicham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#aebdc9;
    font-family:'Cormorant Garamond', serif;
    overflow:hidden;
  }
  #app{
    position:relative;height:100vh;height:100dvh;width:100%;
    display:flex;align-items:center;justify-content:center;
  }
  .page{
    position:relative;height:100%;width:fit-content;
    display:none;
  }
  .page.active{display:block;}
  .page img{
    height:100%;width:auto;display:block;margin:0 auto;
  }
  .envelope-scene{
    position:relative;height:100%;width:fit-content;
    perspective:1400px;
  }
  .flap{
    position:absolute;top:0;left:0;width:100%;height:100%;
    background-image:url(envelope.png);
    background-size:100% 100%;
    background-position:top center;
    clip-path:polygon(0 0, 100% 0, 50% 45%);
    transform-origin:top center;
    transform-style:preserve-3d;
    transition:transform 1s cubic-bezier(.4,.1,.3,1), opacity .4s ease .8s;
    z-index:3;
  }
  .flap.open{
    transform:rotateX(-170deg);
    opacity:0;
  }
  .envelope-fade{
    transition:opacity .5s ease .9s;
  }
  .envelope-fade.hide{
    opacity:0;
  }
  .hotspot{
    position:absolute;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
  }
  .result-banner{
    position:absolute;
    left:6%;right:6%;
    text-align:center;
    font-style:italic;
    font-size:clamp(13px,3.6vw,16px);
    color:#2f3a44;
    background:rgba(255,253,247,.88);
    border-radius:6px;
    padding:10px 14px;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
    pointer-events:none;
  }
  .result-banner.show{
    opacity:1;transform:translateY(0);
  }
</style>
</head>
<body>
<div id="app">

  <div class="page active" id="page-envelope">
    <div class="envelope-scene">
      <img src="envelope.png" class="envelope-fade" id="envelope-img" alt="Enveloppe avec sceau de cire I et H">
      <div class="flap" id="flap"></div>
      <button class="hotspot" id="seal-hotspot"
        style="left:31%; top:32%; width:38%; height:34%; z-index:4;"
        aria-label="Ouvrir l'invitation"></button>
    </div>
  </div>

  <div class="page" id="page-details">
    <img src="details.png" alt="We're getting married, Hicham et Ibtissam, 12 septembre 2026, Pavillon Maya, Marrakech">

    <a class="hotspot" id="map-hotspot"
      href="https://www.google.com/maps/dir//Pavillon+Maya,+3,5+Km,+route+de+l'Ourika,+Marrakech+40000/@31.6627857,-7.9919869,15z/data=!4m8!4m7!1m0!1m5!1m1!1s0xdafef1a645d56b1:0x9b38d9c2d1124c2b!2m2!1d-7.9809081!2d31.5722392?entry=ttu&g_ep=EgoyMDI2MDcyNi4wIKXMDSoASAFQAw%3D%3D"
      target="_blank" rel="noopener"
      style="left:24%; top:55.5%; width:52%; height:5%;"
      aria-label="Voir sur Google Maps"></a>

    <button class="hotspot" id="yes-hotspot"
      style="left:6%; top:92%; width:36%; height:6%;"
      aria-label="Yes, I'll be there"></button>

    <button class="hotspot" id="no-hotspot"
      style="left:45%; top:92%; width:36%; height:6%;"
      aria-label="Sorry, I can't"></button>

    <div class="result-banner" id="result-banner" style="top:99.5%;"></div>
  </div>

</div>

<script>
  const pageEnvelope = document.getElementById('page-envelope');
  const pageDetails = document.getElementById('page-details');
  const resultBanner = document.getElementById('result-banner');

  document.getElementById('seal-hotspot').addEventListener('click', ()=>{
    document.getElementById('flap').classList.add('open');
    document.getElementById('envelope-img').classList.add('hide');
    setTimeout(()=>{
      pageEnvelope.classList.remove('active');
      pageDetails.classList.add('active');
      window.scrollTo({top:0, behavior:'instant'});
    }, 1300);
  });

  document.getElementById('yes-hotspot').addEventListener('click', ()=>{
    resultBanner.textContent = "Wonderful — we can't wait to celebrate with you!";
    resultBanner.classList.add('show');
  });

  document.getElementById('no-hotspot').addEventListener('click', ()=>{
    resultBanner.textContent = "We'll miss you — thank you for letting us know.";
    resultBanner.classList.add('show');
  });
</script>
</body>
</html>
